services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.gateway
    container_name: llm-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - MAX_BATCH_SIZE=16
      - BATCH_TIMEOUT_MS=20ms
      - BACKEND_URL=http://llm-worker:8000
      - MODEL_NAME=meta-llama/Llama-3-8B-Instruct-AWQ
      - QUANTIZATION_TYPE=AWQ-4bit
      - REDIS_ADDR=redis:6379
      - CACHE_ENABLED=true
      - CACHE_TTL_MINUTES=60m
      - POSTGRES_DSN=postgres://postgres:postgres@postgres:5432/llm_metadata?sslmode=disable
      - AUDIT_LOGGING_ENABLED=true
      - POSTGRES_FLUSH_INTERVAL_MS=500ms
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RPM=120
      - RATE_LIMIT_BURST=20
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      llm-worker:
        condition: service_healthy

  llm-worker:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.mock_llm
    container_name: llm-quantized-worker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WORKER_PORT=8000
      - MODEL_NAME=meta-llama/Llama-3-8B-Instruct-AWQ
      - QUANTIZATION_TYPE=AWQ-4bit
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: llm-redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: llm-postgres-logs
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=llm_metadata
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_metadata"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: llm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway

volumes:
  pgdata:
