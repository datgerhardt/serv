apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-config
  namespace: llm-serving
data:
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  MAX_BATCH_SIZE: "32"
  BATCH_TIMEOUT_MS: "20ms"
  QUEUE_CAPACITY: "4096"
  BACKEND_URL: "http://llm-worker.llm-serving.svc.cluster.local:8000"
  BACKEND_TIMEOUT_MS: "30s"
  MODEL_NAME: "meta-llama/Llama-3-8B-Instruct-AWQ"
  QUANTIZATION_TYPE: "AWQ-4bit"
  CACHE_ENABLED: "true"
  CACHE_TTL_MINUTES: "120m"
  AUDIT_LOGGING_ENABLED: "true"
  POSTGRES_MAX_CONNS: "50"
  POSTGRES_BUFFER_CAPACITY: "10000"
  POSTGRES_FLUSH_INTERVAL_MS: "500ms"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RPM: "120"
  RATE_LIMIT_BURST: "20"
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-secrets
  namespace: llm-serving
type: Opaque
# NOTE: Do not commit real credentials. Inject production values via
# External Secrets Operator, SealedSecrets, or your cluster secret manager.
stringData:
  REDIS_ADDR: "redis-master.storage.svc.cluster.local:6379"
  REDIS_PASSWORD: ""
  POSTGRES_DSN: "postgres://llm_user:CHANGE_ME_IN_EXTERNAL_SECRET_MANAGER@postgres-pool.storage.svc.cluster.local:5432/llm_metadata?sslmode=require"
  HF_TOKEN: "CHANGE_ME_IN_EXTERNAL_SECRET_MANAGER"
