global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "llm-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          environment: "local"
          tier: "api-gateway"

  - job_name: "vllm-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["llm-worker:8000"]
        labels:
          environment: "local"
          tier: "inference-worker"
