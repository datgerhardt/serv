apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: llm-gateway-rollout
  namespace: llm-serving
  labels:
    app: llm-gateway
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: llm-gateway
  strategy:
    canary:
      canaryService: llm-gateway-canary
      stableService: llm-gateway-stable
      trafficRouting:
        nginx:
          stableIngress: llm-gateway-ingress
      steps:
        # Step 1: Route 10% traffic to canary and pause for initial warm-up
        - setWeight: 10
        - pause: { duration: 60s }
        # Step 2: Run automated SLO verification against Prometheus
        - analysis:
            templates:
              - templateName: llm-gateway-canary-slo
        # Step 3: Expand to 25% traffic
        - setWeight: 25
        - pause: { duration: 120s }
        # Step 4: Expand to 50% traffic
        - setWeight: 50
        - pause: { duration: 180s }
        # Step 5: Final analysis before full promotion
        - analysis:
            templates:
              - templateName: llm-gateway-canary-slo
        # Step 6: 100% full promotion
        - setWeight: 100
  template:
    metadata:
      labels:
        app: llm-gateway
        tier: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: ghcr.io/organization/llm-gateway:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: llm-gateway-config
            - secretRef:
                name: llm-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-stable
  namespace: llm-serving
  labels:
    app: llm-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: llm-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-canary
  namespace: llm-serving
  labels:
    app: llm-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: llm-gateway
